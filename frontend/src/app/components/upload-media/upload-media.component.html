<div class="content-container">
  <h2 class="cool-title">Add Media Item</h2>

  <form (ngSubmit)="onSubmit()" #itemForm="ngForm" class="add-media-form">
    <div class="form-group">
      <label for="mediaType">Media Type:</label>
      <select
        id="mediaType"
        name="mediaType"
        [(ngModel)]="mediaType"
        (change)="onMediaTypeChange(mediaType)"
        required
        class="form-input"
      >
        <option *ngFor="let option of mediaTypeOptions" [ngValue]="option.value">
          {{ option.label }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="name">Title:</label>
      <input
        type="text"
        id="name"
        name="name"
        [(ngModel)]="item.name"
        required
        class="form-input"
        placeholder="Enter title"
      />
    </div>

    <div class="form-group">
      <label for="status">Status:</label>
      <select
        id="status"
        name="status"
        [(ngModel)]="item.status"
        required
        class="form-input"
      >
        <option [ngValue]="MediaStatusEnum.COMPLETED">Completed</option>
        <option [ngValue]="MediaStatusEnum.IN_PROGRESS">In Progress</option>
        <option [ngValue]="MediaStatusEnum.BACKLOG">Backlog</option>
      </select>
    </div>

    <div class="form-group" *ngIf="item.status === MediaStatusEnum.COMPLETED">
      <label for="completedAt">Completed Date:</label>
      <input
        type="date"
        id="completedAt"
        name="completedAt"
        [(ngModel)]="item.completedAt"
        required
        class="form-input"
      />
    </div>

    <div class="form-group form-checkbox">
      <label>
        <input
          type="checkbox"
          [(ngModel)]="includeImage"
          name="includeImage"
        />
        Include an image?
      </label>
    </div>

    <div *ngIf="includeImage" class="form-group">
      <label for="imageUrl">
        Image URL:
      </label>
      <input
        type="text"
        id="imageUrl"
        name="imageUrl"
        [(ngModel)]="item.imageUrl"
        class="form-input"
        placeholder="Enter image URL"
      />
    </div>

    <div *ngIf="includeImage && item.imageUrl" class="image-preview">
      <p>Image Preview:</p>
      <img
        [src]="item.imageUrl"
        alt="Preview"
        class="preview-img"
      />
    </div>

    <div class="button-container">
      <button type="submit" [disabled]="!itemForm.form.valid" class="submit-btn">
        Submit
      </button>
      <button type="button" (click)="onCancel()" class="cancel-btn">
        Cancel
      </button>
    </div>
  </form>
</div>
