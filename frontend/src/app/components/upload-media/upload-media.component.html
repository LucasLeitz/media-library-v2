<div class="content-container">
  <h2 class="cool-title">Add {{mediaLabel}}</h2>

  <form (ngSubmit)="onSubmit()" #itemForm="ngForm" class="add-media-form">
    <div class="form-group">
      <label for="mediaType">Media Type:</label>
      <select
        id="mediaType"
        name="mediaType"
        [(ngModel)]="mediaType"
        (change)="onMediaTypeChange(mediaType)"
        required
        class="form-input"
      >
        <option *ngFor="let option of mediaTypeOptions" [ngValue]="option.value">
          {{ option.label }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="name">Title:</label>
      <input
        type="text"
        id="name"
        name="name"
        [(ngModel)]="item.name"
        required
        class="form-input"
        placeholder="Enter title"
      />
    </div>

    <div class="form-group">
      <label for="status">Status:</label>
      <select
        id="status"
        name="status"
        [(ngModel)]="item.status"
        required
        class="form-input"
      >
        <option [ngValue]="MediaStatusEnum.COMPLETED">Completed</option>
        <option [ngValue]="MediaStatusEnum.IN_PROGRESS">In Progress</option>
        <option [ngValue]="MediaStatusEnum.BACKLOG">Backlog</option>
      </select>
    </div>

    <div *ngIf="mediaType === 'BOOK'" class="form-group">
      <label for="author">Author:</label>
      <input
        type="text"
        id="author"
        name="author"
        [(ngModel)]="author"
        class="form-input"
        placeholder="Enter author name (optional)">
    </div>

    <!-- Game-specific fields -->
    <div *ngIf="mediaType === 'GAME'" class="form-group">
      <label for="platform">Platform: <span class="required">*</span></label>
      <select
        id="platform"
        name="platform"
        [(ngModel)]="platform"
        class="form-input"
        required>
        <option value="">Select a platform</option>
        <option value="GAMEBOY_ADVANCE">Game Boy Advance</option>
        <option value="GAMECUBE">GameCube</option>
        <option value="NES">NES</option>
        <option value="NINTENDO_3DS">Nintendo 3DS</option>
        <option value="NINTENDO_64">Nintendo 64</option>
        <option value="NINTENDO_DS">Nintendo DS</option>
        <option value="NINTENDO_SWITCH">Nintendo Switch</option>
        <option value="NINTENDO_SWITCH_2">Nintendo Switch 2</option>
        <option value="PC">PC</option>
        <option value="PLAYSTATION_1">PlayStation 1</option>
        <option value="PLAYSTATION_2">PlayStation 2</option>
        <option value="PLAYSTATION_3">PlayStation 3</option>
        <option value="PLAYSTATION_4">PlayStation 4</option>
        <option value="PLAYSTATION_5">PlayStation 5</option>
        <option value="SNES">SNES</option>
        <option value="OTHER">Other</option>
      </select>
    </div>



    <div class="form-group" *ngIf="item.status === MediaStatusEnum.COMPLETED">
      <label for="completedAt">Completed Date:</label>
      <input
        type="date"
        id="completedAt"
        name="completedAt"
        [(ngModel)]="item.completedAt"
        required
        class="form-input"
      />
    </div>

    <div class="form-group form-checkbox">
      <label>
        <input
          type="checkbox"
          [(ngModel)]="includeImage"
          name="includeImage"
        />
        Include an image?
      </label>
    </div>

    <div *ngIf="includeImage" class="form-group">
      <label for="imageUrl">
        Image URL:
      </label>
      <input
        type="text"
        id="imageUrl"
        name="imageUrl"
        [(ngModel)]="item.imageUrl"
        class="form-input"
        placeholder="Enter image URL"
      />
    </div>

    <div *ngIf="includeImage && item.imageUrl" class="image-preview">
      <p>Image Preview:</p>
      <img
        [src]="item.imageUrl"
        alt="Preview"
        class="preview-img"
      />
    </div>

    <div class="button-container">
      <button type="submit" [disabled]="!itemForm.form.valid" class="submit-btn">
        Submit
      </button>
      <button type="button" (click)="onCancel()" class="cancel-btn">
        Cancel
      </button>
    </div>
  </form>
</div>
