<div class="content-container" *ngIf="!isLoading && item; else loadingOrError">
  <h2 class="cool-title">Edit {{ mediaLabel }}</h2>

  <form class="edit-media-form">
    <!-- Title -->
    <div class="form-group">
      <label for="name">Title:</label>
      <input
        type="text"
        id="name"
        name="name"
        [(ngModel)]="item.name"
        required
        class="form-input"
        placeholder="Enter title"
      />
    </div>

    <!-- Status -->
    <div class="form-group">
      <label for="status">Status:</label>
      <select
        id="status"
        name="status"
        [(ngModel)]="item.status"
        required
        class="form-input"
      >
        <option [ngValue]="MediaStatusEnum.COMPLETED">Completed</option>
        <option [ngValue]="MediaStatusEnum.IN_PROGRESS">In Progress</option>
        <option [ngValue]="MediaStatusEnum.BACKLOG">Backlog</option>
      </select>
    </div>

    <!-- Completed Date (only if status is COMPLETED) -->
    <div class="form-group" *ngIf="item.status === MediaStatusEnum.COMPLETED">
      <label for="completedAt">Completed Date:</label>
      <input
        type="date"
        id="completedAt"
        name="completedAt"
        [(ngModel)]="item.completedAt"
        required
        class="form-input"
      />
    </div>

    <div *ngIf="item.type === 'BOOK'" class="form-group">
      <label for="author">Author:</label>
      <input
        type="text"
        id="author"
        name="author"
        [value]="item.bookDetails?.author || ''"
        #authorInput
        class="form-input"
        placeholder="Enter author name"
      />
      <button
        type="button"
        (click)="updateAuthor(authorInput.value)"
        class="update-author-button"
      >
        Update Author
      </button>
    </div>

    <!-- Game-specific fields -->
    <div *ngIf="item.type === 'GAME'" class="form-group">
      <label for="platform">Platform:</label>
      <select
        id="platform"
        name="platform"
        [(ngModel)]="selectedPlatform"
        class="form-input"
      >
        <option value="">Select a platform</option>
        <option value="GAMEBOY_ADVANCE">Game Boy Advance</option>
        <option value="GAMECUBE">GameCube</option>
        <option value="NES">NES</option>
        <option value="NINTENDO_3DS">Nintendo 3DS</option>
        <option value="NINTENDO_64">Nintendo 64</option>
        <option value="NINTENDO_DS">Nintendo DS</option>
        <option value="NINTENDO_SWITCH">Nintendo Switch</option>
        <option value="NINTENDO_SWITCH_2">Nintendo Switch 2</option>
        <option value="PC">PC</option>
        <option value="PLAYSTATION_1">PlayStation 1</option>
        <option value="PLAYSTATION_2">PlayStation 2</option>
        <option value="PLAYSTATION_3">PlayStation 3</option>
        <option value="PLAYSTATION_4">PlayStation 4</option>
        <option value="PLAYSTATION_5">PlayStation 5</option>
        <option value="SNES">SNES</option>
        <option value="OTHER">Other</option>
      </select>
      <button
        type="button"
        (click)="updatePlatform(selectedPlatform)"
        class="update-platform-button"
      >
        Update Platform
      </button>
    </div>

    <!-- New Image URL Input -->
    <div class="form-group">
      <label for="newImageUrl">New Image URL:</label>
      <input
        type="text"
        id="newImageUrl"
        name="newImageUrl"
        [(ngModel)]="newImageUrl"
        (input)="updatePreview()"
        class="form-input"
        placeholder="Enter new image URL"
      />
    </div>

    <!-- Preview of New Image -->
    <div *ngIf="newImageUrl" class="image-preview">
      <p>New Image Preview:</p>
      <img [src]="newImageUrl" alt="New Image Preview" class="preview-img" />
    </div>

    <!-- Existing Image Preview -->
    <div *ngIf="!newImageUrl && item.imageUrl" class="image-preview">
      <p>Current Image Preview:</p>
      <img
        [src]="item.imageUrl!"
        alt="Current Image Preview"
        class="preview-img"
      />
    </div>

    <!-- Buttons -->
    <div class="button-container">
      <button (click)="onSave()" type="button" class="save-btn">Save</button>
      <button (click)="onCancel()" type="button" class="cancel-btn">
        Cancel
      </button>
    </div>
  </form>
</div>

<ng-template #loadingOrError>
  <div class="content-container">
    <div *ngIf="isLoading" class="loading-spinner">Loading...</div>
    <div *ngIf="!isLoading && errorMessage" class="error-message">
      {{ errorMessage }}
    </div>
  </div>
</ng-template>
