services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
    expose:
      - "8080"
    restart: unless-stopped

  web:
    image: nginx:stable-alpine
    depends_on:
      - api
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-8081}:80"
    restart: unless-stopped
