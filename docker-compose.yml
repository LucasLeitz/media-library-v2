services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: media-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run start
    environment:
      - CHOKIDAR_USEPOLLING=true

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - mysql
    expose:
      - "8080"
    restart: unless-stopped

  web:
    image: nginx:stable-alpine
    depends_on:
      - api
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-8081}:80"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: media_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: media_library
      MYSQL_USER: app_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - media_mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  media_mysql_data: